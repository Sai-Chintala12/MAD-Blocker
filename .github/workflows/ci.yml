name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check that the stylesheet is up to date
        run: npm run build -- --check
      - name: Check for personal information
        run: npm run check:privacy
      - name: Build the store package
        run: npm run package
